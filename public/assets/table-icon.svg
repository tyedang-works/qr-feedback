<svg xmlns="http://www.w3.org/2000/svg"
     width="96" height="96" viewBox="0 0 96 96"
     fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dining plate with fork and knife</title>
  <desc id="desc">A top-view dinner plate with a fork on the left and a table knife on the right.</desc>

  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dinner plate -->
    <circle cx="48" cy="48" r="32.5" stroke-width="2.8"/>
    <circle cx="48" cy="48" r="21.5" stroke-width="2.5"/>

    <!-- Fork: four distinct tines and a gently tapered handle -->
    <g stroke-width="2.6">
      <path d="M12.5 12.5v12.2"/>
      <path d="M17.5 12.5v12.2"/>
      <path d="M22.5 12.5v12.2"/>
      <path d="M27.5 12.5v12.2"/>
      <path d="M12.5 24.7c0 5.1 3.2 8.1 7.5 8.1s7.5-3 7.5-8.1"/>
      <path d="M20 32.8v49.5"/>
    </g>

    <!-- Table knife: rounded blade and slim handle -->
    <path
      d="M73.2 12.8c-5.2 5.8-7.5 13.3-7.5 21.4 0 5.1 2.1 8.2 5.9 9.1v39
         c0 1.6 1.1 2.8 2.6 2.8s2.6-1.2 2.6-2.8V43.3
         c3.8-.9 5.9-4 5.9-9.1 0-8.1-2.3-15.6-7.5-21.4-.6-.7-1.4-.7-2 0Z"
      fill="currentColor"
      stroke="none"/>
  </g>
</svg>
